<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeAuto</title><link rel="stylesheet" href="/styles.css?v=20260823-2"></head><body><div id="app"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><strong>CodeAuto</strong><span>Java Agent Workspace</span></div></div><div class="top-actions"><span id="connection" class="status-pill">连接中</span><button id="new-session" class="ghost">新会话</button></div></header><main class="shell"><aside class="sidebar"><div class="side-title">工作区</div><div id="workspace" class="workspace"></div><div class="side-title map-title">会话地图</div><div id="session-map" class="session-map"></div><div class="side-title">Agent 看板</div><div id="metrics" class="metrics"></div></aside><section class="content"><div class="content-head"><div><div class="eyebrow">当前会话</div><h1 id="session-title">选择一个会话</h1><div id="session-meta" class="muted">CodeAuto 的事件流、工具轨迹与评估数据会显示在这里</div></div><div class="view-switch"><button class="view active" data-view="chat">对话</button><button class="view" data-view="trace">追踪</button><button class="view" data-view="board">评估</button></div></div><div id="chat-view" class="view-panel"><div id="transcript" class="transcript"><div class="empty"><div class="empty-icon">✦</div><h2>开始一次新的工程对话</h2><p>让 Agent 阅读代码、修改文件或解释当前工作区。所有工具调用都会留下可追溯记录。</p></div></div><form id="composer" class="composer"><textarea id="prompt" placeholder="描述你想完成的事情…（Enter 发送，Shift+Enter 换行）"></textarea><button type="submit" class="send">发送 <span>⌘↵</span></button></form></div><div id="trace-view" class="view-panel hidden"><div id="timeline" class="timeline"></div></div><div id="board-view" class="view-panel hidden"><div id="board" class="board"></div></div></section></main></div><script src="/app.js?v=20260823-2"></script></body></html>
